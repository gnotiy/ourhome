<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<title>共同支出紀錄</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F7F5F0;--sf:#FFFFFF;--sf2:#EFEFEA;
  --bd:rgba(0,0,0,.09);--bds:rgba(0,0,0,.15);
  --t1:#1A1917;--t2:#5A5854;--t3:#9A9692;
  --an:#C97B3A;--anl:#FBEFE2;        /* 安 橘 + 淺底 */
  --zo:#3E8F89;--zol:#E4F1F0;        /* 佐 青 + 淺底 */
  --pu:#7A6BAA;--pul:#EFEDF7;        /* 結算 紫 + 淺底 */
  --g:#1D9E75;--gl:#E1F5EE;          /* 減少/良好 綠 */
  --r:#E24B4A;--rl:#FEF0F0;          /* 增加/超支 紅 */
  --ra:14px;--rs:8px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#141412;--sf:#1E1D1B;--sf2:#272522;
  --bd:rgba(255,255,255,.08);--bds:rgba(255,255,255,.16);
  --t1:#F0EDE8;--t2:#A09C97;--t3:#6A6662;
  --anl:#2E2114;--zol:#0E2624;--pul:#1E1B2C;
  --gl:#0A2E1E;--rl:#2E0F0E;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:'Noto Sans TC',sans-serif;color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--bds);border-radius:2px}
.mono{font-family:'DM Mono',monospace;letter-spacing:-.3px}

#header{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 18px;position:sticky;top:0;z-index:50}
#header-top{display:flex;align-items:center;justify-content:space-between;padding-top:16px;padding-bottom:4px}
#header h1{font-size:18px;font-weight:700;color:var(--t1)}
#header-sub{font-size:11px;color:var(--t3);margin-top:2px;font-family:'DM Mono',monospace}
#tabs{display:flex;margin-top:10px;gap:2px}
.tab-btn{flex:1;padding:10px 0;border:none;background:transparent;font-size:13px;color:var(--t3);border-bottom:2px solid transparent;transition:all .18s;font-weight:500}
.tab-btn.active{color:var(--t1);font-weight:700;border-bottom-color:var(--t1)}
#wave{height:3px;background:linear-gradient(90deg,var(--an),var(--zo) 55%,var(--pu));opacity:.55}

#content{max-width:620px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--ra);padding:18px;margin-bottom:14px}
.section-lbl{font-size:11px;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;font-weight:700;margin-bottom:10px}
.field-lbl{display:block;font-size:13px;color:var(--t2);margin-bottom:8px}
.req{color:var(--an);margin-left:2px}

#person-grid{display:flex;gap:12px;margin-bottom:20px}
.person-btn{flex:1;padding:16px 12px;border-radius:var(--ra);border:1px solid var(--bds);background:var(--sf2);display:flex;flex-direction:column;align-items:center;gap:8px;transition:all .18s}
.person-btn:active{transform:scale(.97)}
.person-btn.active-an{border:2px solid var(--an);background:var(--anl)}
.person-btn.active-zo{border:2px solid var(--zo);background:var(--zol)}
.person-name{font-size:15px;font-weight:700;color:var(--t3)}
.person-btn.active-an .person-name{color:var(--an)}
.person-btn.active-zo .person-name{color:var(--zo)}

.group-title{font-size:11px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin:14px 0 6px}
.cat-btn{padding:7px 13px;border-radius:20px;border:1px solid var(--bds);background:var(--sf2);color:var(--t2);font-size:13px;margin:0 6px 6px 0;transition:all .15s;white-space:nowrap}
.cat-btn:active{transform:scale(.96)}
.cat-btn.active{border:1.5px solid var(--zo);background:var(--zol);color:var(--zo);font-weight:700}

.amt-wrap{position:relative;margin:16px 0}
.amt-prefix{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:13px;pointer-events:none}
#amt-input{width:100%;padding:12px 13px 12px 42px;border-radius:var(--rs);border:1px solid var(--bds);background:var(--bg);color:var(--t1);font-size:16px;outline:none}
#note-input{width:100%;padding:11px 13px;border-radius:var(--rs);border:1px solid var(--bds);background:var(--bg);color:var(--t1);font-size:14px;margin-bottom:16px;outline:none}
#amt-input:focus,#note-input:focus,#date-input:focus{border-color:var(--zo)}
#date-input{width:100%;padding:11px 13px;border-radius:var(--rs);border:1px solid var(--bds);background:var(--bg);color:var(--t1);font-size:15px;font-family:inherit;margin-bottom:4px;outline:none;color-scheme:light dark}
#err-msg{color:var(--r);font-size:13px;margin-bottom:12px;text-align:center;display:none}
#submit-btn{width:100%;padding:14px;border-radius:var(--rs);border:none;background:var(--t1);color:var(--bg);font-size:16px;font-weight:700;letter-spacing:.04em;transition:opacity .2s}
#submit-btn:active{opacity:.85}
#submit-btn:disabled{opacity:.5;cursor:not-allowed}

.ghost{padding:6px 12px;border-radius:20px;border:1px solid var(--bds);background:var(--sf);color:var(--t3);font-size:12px}
.ghost:active{opacity:.7}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.overlay.hidden{display:none}
.bottom-sheet{background:var(--sf);border-radius:20px 20px 0 0;border:1px solid var(--bd);padding:20px 20px 36px;max-width:620px;width:100%;max-height:90vh;overflow-y:auto}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--bds);margin:0 auto 16px}

/* 指標卡（同記帳很重要） */
.m3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.mc{background:var(--sf2);border-radius:var(--rs);padding:12px;text-align:center}
.ml{font-size:11px;color:var(--t3)}
.mn{font-size:17px;font-weight:700;margin-top:4px;font-family:'DM Mono',monospace;letter-spacing:-.5px}
.mn-sub{font-size:10px;color:var(--t3);margin-top:3px;font-family:'DM Mono',monospace}
.gi{color:var(--g)}.ri{color:var(--r)}.ani{color:var(--an)}.zoi{color:var(--zo)}.pui{color:var(--pu)}

/* 圖例 + 類別明細 */
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.cat-list{display:flex;flex-direction:column}
.cat-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.cat-row:last-child{border-bottom:none}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cat-name{flex:1;font-size:13px;color:var(--t2)}
.cat-bar-wrap{width:60px;height:4px;background:var(--sf2);border-radius:2px;overflow:hidden}
.cat-bar{height:100%;border-radius:2px}
.cat-pct{font-size:11px;color:var(--t3);min-width:32px;text-align:right}
.cat-amt{font-size:13px;font-family:'DM Mono',monospace;font-weight:500;min-width:62px;text-align:right;color:var(--t1)}

/* 同期比較列 */
.yoy-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.yoy-row:last-child{border-bottom:none}
.yoy-lbl{font-size:13px;color:var(--t2);flex:1}
.yoy-vals{display:flex;align-items:center;gap:8px}
.yoy-cur{font-size:13px;font-family:'DM Mono',monospace;min-width:64px;text-align:right;color:var(--t1)}
.yoy-diff{font-size:11px;font-family:'DM Mono',monospace;min-width:58px;text-align:right;padding:2px 5px;border-radius:4px}
.yoy-diff.up{color:var(--r);background:var(--rl)}
.yoy-diff.dn{color:var(--g);background:var(--gl)}
.yoy-diff.eq{color:var(--t3)}

/* 結算卡 */
#settle-card{background:var(--pul);border:1px solid var(--bd);border-radius:var(--ra);padding:20px;margin-bottom:14px;display:none}
#settle-card.visible{display:block}
.settle-amount-box{background:var(--sf);border:1px solid var(--bds);border-radius:12px;padding:14px 16px;margin-bottom:14px;text-align:center}
.dir-btn{flex:1;padding:11px;border-radius:10px;border:1px solid var(--bds);background:var(--sf2);color:var(--t2);font-size:14px;font-weight:600;transition:all .15s}
.dir-btn:active{transform:scale(.97)}
.dir-btn.active{border:1.5px solid var(--pu);background:var(--pul);color:var(--pu)}

/* 明細列 */
.hist-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.hist-row:last-child{border-bottom:none}
.hist-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.hist-cat{font-size:13px;color:var(--t1);font-weight:600}
.hist-note{font-size:11px;color:var(--t3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-amt{font-size:15px;font-weight:700;text-align:right;font-family:'DM Mono',monospace}
.hist-who{font-size:10px;color:var(--t3);margin-top:1px;text-align:right}
.del-btn{background:none;border:none;color:var(--t3);font-size:14px;cursor:pointer;padding:4px 0 4px 8px;opacity:.5;flex-shrink:0;align-self:center}
.del-btn:active{opacity:1;color:var(--r)}

/* dash 狀態 */
#dash-loading{text-align:center;padding:64px 24px;color:var(--t3)}
#dash-loading p{font-size:14px;margin-top:12px}
#dash-error{display:none;text-align:center;padding:48px 24px}
#dash-empty{display:none;text-align:center;padding:48px 24px}
#dash-empty p,#dash-error p{color:var(--t2);font-size:14px;margin-top:12px}
.sea-btn{padding:10px 24px;border-radius:12px;border:none;background:var(--t1);color:var(--bg);font-size:15px;font-weight:700;margin-top:16px}
.err-btn{padding:10px 24px;border-radius:12px;border:1px solid var(--bds);background:var(--sf);color:var(--t1);font-size:15px;font-weight:700;margin-top:16px}
#dash-content{display:none}

#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);color:#fff;border-radius:24px;padding:10px 22px;font-size:14px;font-weight:600;z-index:200;white-space:nowrap;pointer-events:none;transition:opacity .3s;opacity:0}
#toast.show{opacity:1}
#toast.big{font-size:15.5px;font-weight:700;padding:16px 28px;border-radius:18px;bottom:44px;box-shadow:0 12px 34px rgba(0,0,0,.28)}
#toast.big.show{animation:toastpop .26s ease}
@keyframes toastpop{0%{transform:translateX(-50%) scale(.82)}60%{transform:translateX(-50%) scale(1.04)}100%{transform:translateX(-50%) scale(1)}}

/* ★ 送出成功動畫 */
.sok{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:300;pointer-events:none;opacity:0;background:rgba(0,0,0,0);transition:opacity .18s,background .18s}
.sok.show{opacity:1;background:rgba(0,0,0,.14)}
@media(prefers-color-scheme:dark){.sok.show{background:rgba(0,0,0,.4)}}
.sok-box{display:flex;flex-direction:column;align-items:center;gap:18px;transform:scale(.85);transition:transform .2s}
.sok.show .sok-box{transform:scale(1)}
.sok-badge{position:relative;width:104px;height:104px;display:flex;align-items:center;justify-content:center}
.sok-ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--zo);opacity:0}
.sok.show .sok-ring{animation:sokRing .75s ease-out forwards}
.sok.show .sok-ring.r2{animation-delay:.12s}
@keyframes sokRing{0%{transform:scale(.9);opacity:.55}100%{transform:scale(2.3);opacity:0}}
.sok-circle{width:104px;height:104px;border-radius:50%;background:var(--zo);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 44px rgba(62,143,137,.5)}
.sok.show .sok-circle{animation:sokPop .5s cubic-bezier(.2,.8,.3,1.25) both}
@keyframes sokPop{0%{transform:scale(0)}62%{transform:scale(1.14)}100%{transform:scale(1)}}
.sok-circle svg{width:60px;height:60px}
.sok-check{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:44;stroke-dashoffset:44}
.sok.show .sok-check{animation:sokCheck .38s .2s ease forwards}
@keyframes sokCheck{to{stroke-dashoffset:0}}
.sok-msg{font-size:16px;font-weight:700;color:var(--t1);background:var(--sf);padding:11px 22px;border-radius:22px;box-shadow:0 8px 28px rgba(0,0,0,.18);max-width:86vw;text-align:center;opacity:0}
.sok.show .sok-msg{animation:sokMsg .35s .16s ease forwards}
@keyframes sokMsg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div id="header">
  <div id="header-top">
    <div style="display:flex;align-items:center;gap:10px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#C97B3A"><ellipse cx="12" cy="16" rx="5" ry="4"/><ellipse cx="7" cy="10" rx="2.5" ry="3"/><ellipse cx="17" cy="10" rx="2.5" ry="3"/><ellipse cx="5" cy="15" rx="2" ry="2.5"/><ellipse cx="19" cy="15" rx="2" ry="2.5"/></svg>
      <div>
        <h1>共同支出紀錄</h1>
        <div id="header-sub"></div>
      </div>
    </div>
    <button class="ghost" id="sync-btn" onclick="fetchData()">↻ 同步</button>
  </div>
  <div id="tabs">
    <button class="tab-btn active" id="tab-form" onclick="switchTab('form')">📝  記帳</button>
    <button class="tab-btn" id="tab-dashboard" onclick="switchTab('dashboard')">📊  本月</button>
    <button class="tab-btn" id="tab-analysis" onclick="switchTab('analysis')">📈  分析</button>
    <a href="https://docs.google.com/spreadsheets/d/1IF42Ex6ISMapthjAIhdKfKwJ0bDhn6XJYBsl8vLUmGQ/edit?gid=0#gid=0" target="_blank" class="tab-btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center;color:var(--t3)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="margin-right:3px"><path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      試算表
    </a>
  </div>
  <div id="wave"></div>
</div>

<div id="content">
  <!-- FORM -->
  <div id="view-form">
    <div class="card">
      <label class="field-lbl">支出者<span class="req">*</span></label>
      <div id="person-grid">
        <button class="person-btn" id="btn-an" onclick="selectPerson('安')">
          <img id="img-an" style="width:72px;height:72px;border-radius:50%;object-fit:cover"/>
          <span class="person-name">安</span>
        </button>
        <button class="person-btn" id="btn-zo" onclick="selectPerson('佐')">
          <img id="img-zo" style="width:72px;height:72px;border-radius:50%;object-fit:cover"/>
          <span class="person-name">佐</span>
        </button>
      </div>

      <label class="field-lbl">類別<span class="req">*</span></label>
      <div id="cat-grid"></div>

      <label class="field-lbl">日期<span style="color:var(--t3);font-weight:400;margin-left:6px;font-size:11px">預設今天，可改過去或未來</span></label>
      <input id="date-input" type="date"/>

      <div class="amt-wrap">
        <span class="amt-prefix">NT$</span>
        <input id="amt-input" type="number" placeholder="金額" inputmode="numeric"/>
      </div>
      <input id="note-input" type="text" placeholder="備註（選填）"/>
      <div id="err-msg"></div>
      <button id="submit-btn" onclick="submitEntry()">送出記帳</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="view-dashboard" style="display:none">
    <div id="dash-loading">
      <svg width="28" height="28" viewBox="0 0 24 24" style="fill:var(--t3)"><ellipse cx="12" cy="16" rx="5" ry="4"/><ellipse cx="7" cy="10" rx="2.5" ry="3"/><ellipse cx="17" cy="10" rx="2.5" ry="3"/><ellipse cx="5" cy="15" rx="2" ry="2.5"/><ellipse cx="19" cy="15" rx="2" ry="2.5"/></svg>
      <p>正在載入資料…</p>
    </div>

    <div id="dash-error">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="#C97B3A"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      <p id="dash-error-msg">讀取失敗</p>
      <br/>
      <button class="err-btn" onclick="fetchData()">↻ 重試</button>
    </div>

    <div id="dash-empty">
      <p>本月還沒有記帳紀錄</p>
      <button class="sea-btn" onclick="switchTab('form')">開始記帳</button>
    </div>

    <div id="dash-content">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div class="section-lbl" style="margin-bottom:0" id="summary-month-lbl"></div>
          <button class="ghost" onclick="fetchData()">↻ 重新整理</button>
        </div>
        <div class="m3">
          <div class="mc"><div class="ml">本月總支出</div><div id="total-amt" class="mn"></div><div id="total-count" class="mn-sub"></div></div>
          <div class="mc"><div class="ml">安</div><div id="an-amt" class="mn ani"></div></div>
          <div class="mc"><div class="ml">佐</div><div id="zo-amt" class="mn zoi"></div></div>
        </div>
        <div style="margin-top:6px">
          <div class="section-lbl">類別分佈</div>
          <div style="display:flex;justify-content:center;margin:8px 0">
            <svg id="pie-svg" width="160" height="160" viewBox="-80 -80 160 160"></svg>
          </div>
          <div class="chart-legend" id="pie-legend"></div>
        </div>
        <div style="margin-top:20px">
          <div class="section-lbl">各類別明細</div>
          <div class="cat-list" id="cat-detail"></div>
        </div>
        <div style="margin-top:20px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
            <div class="section-lbl" style="margin-bottom:0">記帳明細</div>
            <button id="history-toggle-btn" onclick="toggleHistory()" style="font-size:12px;color:var(--zo);background:transparent;border:none;padding:4px 0;cursor:pointer">顯示全部 ▾</button>
          </div>
          <div id="history-list"></div>
        </div>
      </div>

      <div id="settle-card">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
          <svg width="15" height="15" viewBox="0 0 24 24" style="fill:var(--pu)"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
          <span style="font-size:13px;font-weight:700;color:var(--pu)">累積結算</span>
        </div>
        <div class="settle-amount-box" id="settle-amount-box"></div>
        <button id="settle-trigger-btn" style="width:100%;padding:13px;border-radius:12px;border:none;background:var(--pu);color:#fff;font-size:15px;font-weight:700;display:none" onclick="showSettleConfirm()">確認已完成轉帳</button>
        <div id="settle-confirm-area" style="background:var(--sf);border:1.5px solid var(--pu);border-radius:12px;padding:16px;text-align:center;display:none">
          <div style="font-size:14px;font-weight:700;color:var(--t1);margin-bottom:4px">確定結算嗎？</div>
          <div id="settle-confirm-desc" style="font-size:12px;color:var(--t2);margin-bottom:14px"></div>
          <div style="display:flex;gap:10px">
            <button class="ghost" style="flex:1;padding:11px;border-radius:10px" onclick="hideSettleConfirm()">取消</button>

function getMonthKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function fmtMonth(k){const[y,m]=k.split("-");return y+" 年 "+parseInt(m)+" 月";}
function catLabel(c){return(CATS.find(x=>x.code===c)||{label:c}).label;}
const MONTH=getMonthKey();

document.getElementById("header-sub").textContent=fmtMonth(MONTH);
function pad2(n){return String(n).padStart(2,"0");}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
document.getElementById("date-input").value = todayStr();
document.getElementById("img-an").src = IMG_AN;
document.getElementById("img-zo").src = IMG_ZO;

// build category buttons
(function(){
  const grid=document.getElementById("cat-grid");
  GROUPS.forEach(g=>{
    const cats=CATS.filter(c=>c.group===g);
    if(!cats.length) return;
    const t=document.createElement("div");t.className="group-title";t.textContent=g;grid.appendChild(t);
    const row=document.createElement("div");
    cats.forEach(cat=>{
      const b=document.createElement("button");b.className="cat-btn";b.textContent=cat.label;b.dataset.code=cat.code;
      b.onclick=()=>selectCat(cat.code);row.appendChild(b);
    });
    grid.appendChild(row);
  });
})();

// ── tab ────────────────────────────────────────────────────────────────
function switchTab(t){
  curTab=t;
  document.getElementById("view-form").style.display      = t==="form"     ?"block":"none";
  document.getElementById("view-dashboard").style.display = t==="dashboard"?"block":"none";
  document.getElementById("view-analysis").style.display  = t==="analysis" ?"block":"none";
  document.getElementById("tab-form").classList.toggle("active",      t==="form");
  document.getElementById("tab-dashboard").classList.toggle("active", t==="dashboard");
  document.getElementById("tab-analysis").classList.toggle("active",  t==="analysis");

  // ★ 只有要看數據時才抓資料
  if(t==="dashboard"||t==="analysis"){
    if(isLoading){ if(t==="dashboard") showDashState("loading"); return; }
    if(!dataLoaded){ fetchData(); return; }
    if(t==="dashboard") renderDashboard(); else renderAnalysis();
  }
}

// ── form ───────────────────────────────────────────────────────────────
function selectPerson(p){
  selPerson=p;
  document.getElementById("btn-an").className="person-btn"+(p==="安"?" active-an":"");
  document.getElementById("btn-zo").className="person-btn"+(p==="佐"?" active-zo":"");
}
function selectCat(code){
  selCat=code;
  document.querySelectorAll(".cat-btn").forEach(b=>b.classList.toggle("active",b.dataset.code===code));
}
function showErr(msg){const el=document.getElementById("err-msg");el.textContent=msg;el.style.display=msg?"block":"none";}

document.getElementById("amt-input").addEventListener("keydown",  e=>{if(e.key==="Enter")submitEntry();});
document.getElementById("note-input").addEventListener("keydown", e=>{if(e.key==="Enter")submitEntry();});

// ★ 送出成功動畫
function showSuccess(msg){
  const ov=document.getElementById("sok");
  document.getElementById("sokMsg").textContent=msg;
  ov.classList.remove("show");void ov.offsetWidth;   // 重啟動畫（連續送出時）
  ov.classList.add("show");
  if(navigator.vibrate){try{navigator.vibrate(30);}catch(e){}}
  clearTimeout(showSuccess._t);
  showSuccess._t=setTimeout(()=>ov.classList.remove("show"),1200);
}

// ★ 樂觀更新：先回饋、後送出
function submitEntry(){
  if(!selPerson)   return showErr("請選擇支出者");
  if(!selCat)      return showErr("請選擇類別");
  const amt=Number(document.getElementById("amt-input").value);
  if(!amt||amt<=0) return showErr("請輸入有效金額");
  const dateVal=document.getElementById("date-input").value||todayStr();
  const dObj=new Date(dateVal+"T00:00:00");
  if(isNaN(dObj.getTime())) return showErr("日期格式不正確");
  showErr("");

  const note=document.getElementById("note-input").value;
  const logMonth=dObj.getFullYear()+"-"+pad2(dObj.getMonth()+1);
  const now=new Date();
  const ts=dObj.getFullYear()+"/"+pad2(dObj.getMonth()+1)+"/"+pad2(dObj.getDate())+" "+pad2(now.getHours())+":"+pad2(now.getMinutes())+":"+pad2(now.getSeconds());
  const personSel=selPerson, catCode=selCat, catSel=catLabel(selCat);
  const payload={action:"write",person:personSel,category:catCode,categoryLabel:catSel,amount:amt,note:note,month:logMonth,ts:ts};
  const dateTag=(logMonth===MONTH)?"":"（"+(dObj.getMonth()+1)+"/"+dObj.getDate()+"）";

  // 先入本地、立刻回饋，不等後端
  const rec={person:personSel,category:catCode,categoryLabel:catSel,amount:amt,note:note,month:logMonth,timestamp:ts};
  entries.push(rec); pending.push(rec);

  document.getElementById("amt-input").value="";
  document.getElementById("note-input").value="";
  document.getElementById("date-input").value=todayStr();
  selPerson="";selCat="";
  document.querySelectorAll(".person-btn").forEach(b=>b.className="person-btn");
  document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));
  updateDashTab();
  showSuccess(personSel+"・"+catSel+"　$"+amt.toLocaleString()+dateTag);

  // 背景送出；真的失敗才撤回
  jsonpWrite(payload, function(){
    pending=pending.filter(p=>p!==rec);
  }, function(err){
    pending=pending.filter(p=>p!==rec);
    const i=entries.indexOf(rec); if(i>=0) entries.splice(i,1);
    updateDashTab();
    if(dataLoaded&&curTab==="dashboard") renderDashboard();
    if(dataLoaded&&curTab==="analysis")  renderAnalysis();
    showToast("⚠️ 送出失敗（已撤回）："+err,"err");
  });
}

// ── summary sheet ──────────────────────────────────────────────────────
function openSumSheet(mk){
  mk = mk || MONTH;
  document.getElementById("sum-title").textContent=fmtMonth(mk)+" 收支概況";
  document.getElementById("sum-body").innerHTML=buildSummaryHTML(mk);
  document.getElementById("sum-overlay").classList.remove("hidden");
}
function closeSumSheet(){document.getElementById("sum-overlay").classList.add("hidden");}

// ── JSONP write ────────────────────────────────────────────────────────
function jsonpWrite(params, onSuccess, onError){
  const cbName = "gs_write_" + Date.now() + "_" + Math.floor(Math.random()*10000);
  const script  = document.createElement("script");
  const timer   = setTimeout(()=>{
    cleanup();
    (onError||function(){})("逾時");
  }, 15000);
  function cleanup(){
    clearTimeout(timer);
    delete window[cbName];
    if(script.parentNode) script.parentNode.removeChild(script);
  }
  window[cbName] = function(data){
    cleanup();
    if(data && data.success) (onSuccess||function(){})();
    else (onError||function(){})("寫入回應異常");
  };
  script.onerror = function(){
    cleanup();
    (onError||function(){})("連線失敗");
  };
  const qs = Object.entries({...params, callback: cbName, t: Date.now()})
    .map(([k,v])=>encodeURIComponent(k)+"="+encodeURIComponent(v)).join("&");
  script.src = SCRIPT_URL + "?" + qs;
  document.head.appendChild(script);
}

function fetchData(){
  isLoading=true;
  if(curTab==="dashboard") showDashState("loading");

  const btn=document.getElementById("sync-btn");
  btn.textContent="同步中…";btn.disabled=true;

  const cbName="gs_cb_"+Date.now();
  const script=document.createElement("script");

  const timer=setTimeout(()=>{
    cleanup();
    onFetchError("讀取逾時，請確認 Apps Script 已重新部署");
  },15000);

  function cleanup(){
    isLoading=false;
    btn.textContent="↻ 同步";btn.disabled=false;
    clearTimeout(timer);
    delete window[cbName];
    if(script.parentNode) script.parentNode.removeChild(script);
  }

  window[cbName]=function(data){
    cleanup();
    if(!Array.isArray(data)){
      onFetchError("資料格式錯誤，請確認 Apps Script 程式碼已更新");
      return;
    }
    // ★ 合併尚未確認的樂觀紀錄，避免被覆蓋（同時去重）
    const same=(a,b)=>a.person===b.person&&String(a.category)===String(b.category)
      &&Number(a.amount)===Number(b.amount)&&String(a.note||"")===String(b.note||"");
    entries=data.concat(pending.filter(p=>!data.some(d=>same(d,p))));
    dataLoaded=true;
    showToast("✓ 已同步 "+data.length+" 筆","ok");
    if(curTab==="dashboard") renderDashboard();
    if(curTab==="analysis")  renderAnalysis();
    updateDashTab();
  };

  script.onerror=function(){
    cleanup();
    onFetchError("連線失敗，請確認 Apps Script 網址正確且已部署");
  };

  script.src=SCRIPT_URL+"?callback="+cbName+"&t="+Date.now();
  document.head.appendChild(script);
}

function onFetchError(msg){
  if(curTab==="dashboard"){
    document.getElementById("dash-error-msg").textContent=msg;
    showDashState("error");
  }
  showToast(msg,"err");
}

function normalizeMonth(m){
  if(!m) return "";
  const s = String(m);
  // already correct format: "2026-03"
  if(/^\d{4}-\d{2}$/.test(s)) return s;
  // ISO date string: "2023-12-31T16:00:00.000Z" → use UTC+8 date
  if(s.includes("T")){
    const d = new Date(s);
    const local = new Date(d.getTime() + 8*60*60*1000);
    return local.getUTCFullYear()+"-"+String(local.getUTCMonth()+1).padStart(2,"0");
  }
  try{
    const d = new Date(s);
    if(!isNaN(d)) return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  }catch(e){}
  return s;
}
function expensesOf(mk){return entries.filter(e=>normalizeMonth(e.month)===mk&&e.category!=="settle");}
function monthExpenses(){return expensesOf(MONTH);}
function monthAll()     {return entries.filter(e=>normalizeMonth(e.month)===MONTH);}

function buildInlinePie(bycat,total){
  if(!bycat.length) return "";
  let paths="",start=0,r=58;
  bycat.forEach((c,i)=>{
    const slice=(c.value/total)*Math.PI*2;
    const x1=r*Math.sin(start),y1=-r*Math.cos(start);
    const x2=r*Math.sin(start+slice),y2=-r*Math.cos(start+slice);
    const lg=slice>Math.PI?1:0;
    if(bycat.length===1){paths+=`<circle cx="0" cy="0" r="${r}" fill="${PAL[i%PAL.length]}"/>`;}
    else{paths+=`<path d="M0,0 L${x1},${y1} A${r},${r},0,${lg},1,${x2},${y2} Z" fill="${PAL[i%PAL.length]}"/>`;}
    start+=slice;
  });
  let leg=bycat.map((c,i)=>`<div class="legend-item">
    <div class="legend-dot" style="background:${PAL[i%PAL.length]}"></div>
    <span style="color:var(--t2)">${c.name}</span>
    <span style="font-weight:700;color:var(--t1)">${total>0?Math.round(c.value/total*100):0}%</span>
  </div>`).join("");
  return `<div class="section-lbl" style="margin-top:4px">類別分佈</div>
  <div style="display:flex;justify-content:center;margin:4px 0">
    <svg width="120" height="120" viewBox="-60 -60 120 120">${paths}<circle cx="0" cy="0" r="26" style="fill:var(--sf)"/></svg>
  </div><div class="chart-legend">${leg}</div>`;
}

function drawPie(bycat,total){
  const svg=document.getElementById("pie-svg");
  if(!bycat.length){svg.innerHTML="";return;}
  let h="",start=0,r=68;
  bycat.forEach((c,i)=>{
    const slice=(c.value/total)*Math.PI*2;
    const x1=r*Math.sin(start),y1=-r*Math.cos(start);
    const x2=r*Math.sin(start+slice),y2=-r*Math.cos(start+slice);
    const lg=slice>Math.PI?1:0;
    if(bycat.length===1){h+=`<circle cx="0" cy="0" r="${r}" fill="${PAL[i%PAL.length]}"/>`;}
    else{h+=`<path d="M0,0 L${x1},${y1} A${r},${r},0,${lg},1,${x2},${y2} Z" fill="${PAL[i%PAL.length]}"/>`;}
    start+=slice;
  });
  h+=`<circle cx="0" cy="0" r="30" style="fill:var(--sf)"/>`;
  svg.innerHTML=h;
  document.getElementById("pie-legend").innerHTML=bycat.map((c,i)=>`
    <div class="legend-item"><div class="legend-dot" style="background:${PAL[i%PAL.length]}"></div>
    <span style="color:var(--t2)">${c.name}</span>
    <span style="font-weight:700;color:var(--t1)">${total>0?Math.round(c.value/total*100):0}%</span></div>`).join("");
}

function drawBars(bycat){

function formatTimestamp(ts){
  if(!ts) return "";
  const s = String(ts);
  if(s.includes("T")){
    const d = new Date(s);
    const local = new Date(d.getTime() + 8*60*60*1000);
    const mo = String(local.getUTCMonth()+1).padStart(2,"0");
    const dy = String(local.getUTCDate()).padStart(2,"0");
    const hr = String(local.getUTCHours()).padStart(2,"0");
    const mn = String(local.getUTCMinutes()).padStart(2,"0");
    return `${mo}/${dy} ${hr}:${mn}`;
  }
  const m = s.match(/(\d{1,2})[\/\-](\d{1,2})\D+(\d{1,2}):(\d{2})/);
  if(m) return `${String(m[1]).padStart(2,"0")}/${String(m[2]).padStart(2,"0")} ${m[3]}:${m[4]}`;
  return s.slice(0,10);
}

function deleteEntry(key){
  const r=JSON.parse(decodeURIComponent(key));
  const label = r.category==="settle" ? "結算" : catLabel(r.category);
  if(!confirm(`確定刪除這筆記錄？\n${r.person}・${label}　NT$ ${Number(r.amount).toLocaleString()}${r.note?"\n"+r.note:""}`)) return;
  const payload={action:"delete",person:r.person,category:r.category,amount:r.amount,note:r.note||"",month:r.month};
  jsonpWrite(payload, function(){
    for(let i=entries.length-1;i>=0;i--){
      const e=entries[i];
      if(e.person===r.person && String(e.category)===String(r.category) && Number(e.amount)===Number(r.amount) && String(e.note||"")===String(r.note||"")){
        entries.splice(i,1); break;
      }
    }
    showToast("✓ 已刪除","ok",true);
    updateDashTab();
    if(curTab==="dashboard") renderDashboard();
    if(curTab==="analysis") renderAnalysis();
  }, function(err){
    showToast("刪除失敗："+err,"err");
    fetchData();   // 失敗才重新同步，把畫面校正回來
  });
}

function renderSettleCard(){
  const card    = document.getElementById("settle-card");
  const allExp  = entries.filter(e=>e.category!=="settle");
  const allSettle = entries.filter(e=>e.category==="settle");
  if(!allExp.length){ card.classList.remove("visible"); return; }
  card.classList.add("visible");

  const raw={"安":0,"佐":0};
  allExp.forEach(e=>{ raw[e.person]=(raw[e.person]||0)+Number(e.amount); });

  const eff={...raw};
  allSettle.forEach(e=>{
    const payer = e.person;
    const recv  = payer==="安" ? "佐" : "安";
    const amt   = Number(e.amount);
    eff[payer] = (eff[payer]||0) + amt;
    eff[recv]  = (eff[recv] ||0) - amt;
  });

  const total=raw["安"]+raw["佐"], fair=total/2;
  const diff=eff["安"]-eff["佐"];
  const suggested=Math.abs(Math.round(diff/2));
  const payer=diff>0?"佐":"安";
  const recv =diff>0?"安":"佐";

  const box=document.getElementById("settle-amount-box");
  const trigBtn=document.getElementById("settle-trigger-btn");

  const balLine = suggested===0
    ? `<div style="color:var(--g);font-size:13px;font-weight:700">✓ 目前累積已結清、兩人平衡</div>`
    : `<div style="font-size:13px;color:var(--t2)">系統建議：<b style="color:${PC[payer]}">${payer}</b> 給 <b style="color:${PC[recv]}">${recv}</b> <span class="mono" style="color:var(--pu);font-weight:700">$${suggested.toLocaleString()}</span></div>`;
  const defPayer = suggested>0 ? payer : "安";

  box.innerHTML=`
    <div style="margin-bottom:14px">${balLine}</div>
    <div style="font-size:11px;color:var(--t3);margin-bottom:6px">這次是誰給誰</div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="dir-btn" data-payer="安" onclick="setSettleDir('安')">安 → 佐</button>
      <button class="dir-btn" data-payer="佐" onclick="setSettleDir('佐')">佐 → 安</button>
    </div>
    <div style="font-size:11px;color:var(--t3);margin-bottom:6px">金額（可自行修改）</div>
    <div style="display:flex;align-items:center;gap:8px;justify-content:center">
      <span style="font-size:14px;color:var(--t2)">NT$</span>
      <input id="settle-custom-amt" type="number" inputmode="numeric" value="${suggested>0?suggested:''}" placeholder="0"
        style="width:150px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--pu);font-size:20px;font-weight:700;color:var(--pu);text-align:center;font-family:'DM Mono',monospace;outline:none;background:var(--sf)"/>
    </div>`;
  trigBtn.style.display="block";
  trigBtn.dataset.gap=suggested;
  setSettleDir(defPayer);

  hideSettleConfirm();
  renderSettleHistList();
}

function setSettleDir(payer){
  const recv = payer==="安"?"佐":"安";
  const trigBtn=document.getElementById("settle-trigger-btn");
  if(trigBtn){ trigBtn.dataset.payer=payer; trigBtn.dataset.recv=recv; }

// 結算涉及金錢對帳，維持「等後端確認」的保守作法
function doSettle(){
  const btn=document.getElementById("settle-trigger-btn"),okBtn=document.getElementById("settle-ok-btn");
  const payer=btn.dataset.payer,recv=btn.dataset.recv,gap=Number(btn.dataset.gap);
  if(!gap||gap<=0){ hideSettleConfirm(); return; }
  okBtn.disabled=true;okBtn.textContent="記錄中…";
  const payload={action:"write",person:payer,category:"settle",categoryLabel:"結算",amount:gap,note:`${payer}→${recv}`,month:MONTH};
  jsonpWrite(payload, function(){
    showToast("✓ 結算完成！正在同步…","ok");
    hideSettleConfirm();
    okBtn.disabled=false;okBtn.textContent="✓ 確認結算";
    setTimeout(()=>fetchData(), 1500);
  }, function(err){
    showToast("結算失敗："+err,"err");
    okBtn.disabled=false;okBtn.textContent="✓ 確認結算";
  });
}

// ── analysis ───────────────────────────────────────────────────────────
function renderAnalysis(){
  const expenses = entries.filter(e=>e.category!=="settle");
  if(!expenses.length){
    document.getElementById("analysis-content").innerHTML=`<div style="text-align:center;padding:32px;color:var(--t3);font-size:14px">請先同步資料</div>`;
    return;
  }

  const monthly={};
  expenses.forEach(e=>{
    const m=normalizeMonth(e.month);
    if(!m) return;
    if(!monthly[m]) monthly[m]={total:0};
    monthly[m].total+=Number(e.amount);
  });

  const allMonths=Object.keys(monthly).sort();
  const years=[...new Set(allMonths.map(m=>m.slice(0,4)))].sort().reverse();

  const sel=document.getElementById("analysis-year");
  const curSelYear=sel.value||years[0];
  sel.innerHTML=years.map(y=>`<option value="${y}" ${y===curSelYear?"selected":""}>${y} 年</option>`).join("");
  sel.onchange=()=>renderAnalysis();

  const selYear=sel.value||years[0];
  const prevYear=String(Number(selYear)-1);

  const MONTHS=["01","02","03","04","05","06","07","08","09","10","11","12"];
  const curData=MONTHS.map(m=>monthly[`${selYear}-${m}`]||null);
  const prevData=MONTHS.map(m=>monthly[`${prevYear}-${m}`]||null);
  const monthLabels=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

  const maxVal=Math.max(...curData.map(d=>d?d.total:0),...prevData.map(d=>d?d.total:0),1);
  const barW=100/12;

  const svgH=180, labelH=20, barArea=svgH-labelH-10;
  let bars="";
  MONTHS.forEach((m,i)=>{
    const cur=curData[i], prev=prevData[i];
    const x=i*barW, bw=barW*0.38;
    if(prev){
      const bh=Math.round((prev.total/maxVal)*barArea), by=barArea-bh+10;
      bars+=`<rect x="${x+barW*0.08}%" y="${by}" width="${bw}%" height="${bh}" rx="2" style="fill:var(--t3)" opacity="0.5"/>`;
    }
    if(cur){
      const bh=Math.round((cur.total/maxVal)*barArea), by=barArea-bh+10;
      bars+=`<rect x="${x+barW*0.08+bw+barW*0.04}%" y="${by}" width="${bw}%" height="${bh}" rx="2" style="fill:var(--pu)"/>`;
    }
    bars+=`<text x="${x+barW/2}%" y="${svgH-2}" text-anchor="middle" font-size="9" style="fill:var(--t3)" font-family="inherit">${monthLabels[i]}</text>`;
  });

  const curTotal=curData.reduce((s,d)=>s+(d?d.total:0),0);
  const prevTotal=prevData.reduce((s,d)=>s+(d?d.total:0),0);
  const monthsWithData=curData.filter(d=>d).length||1;
  const diff=curTotal-prevTotal;
  const diffSign=diff>=0?"+":"";
  const diffCls=diff>0?"ri":diff<0?"gi":"";

  // 逐月比較（同期風格列）
  let monRows="";
  MONTHS.forEach((m,i)=>{
    const cur=curData[i], prev=prevData[i];
    if(!cur&&!prev) return;
    const curAmt=cur?cur.total:0, prevAmt=prev?prev.total:0, d=curAmt-prevAmt;
    const cls=(curAmt&&prevAmt)?(d>50?"up":d<-50?"dn":"eq"):"eq";
    const ds=(curAmt&&prevAmt)?((d>=0?"+":"")+"$"+Math.abs(d).toLocaleString()):"—";
    monRows+=`<div class="yoy-row">
      <span class="yoy-lbl">${monthLabels[i]}</span>
      <div class="yoy-vals">
        <span class="yoy-cur">${curAmt?'$'+curAmt.toLocaleString():'—'}</span>
        <span class="yoy-diff ${cls}">${ds}</span>
      </div></div>`;
  });

  // 類別 今年 vs 去年（同期風格列）
  const catTotals={}, prevCatTotals={};
  expenses.filter(e=>{const m=normalizeMonth(e.month);return m&&m.startsWith(selYear);}).forEach(e=>{catTotals[e.category]=(catTotals[e.category]||0)+Number(e.amount);});
  expenses.filter(e=>{const m=normalizeMonth(e.month);return m&&m.startsWith(prevYear);}).forEach(e=>{prevCatTotals[e.category]=(prevCatTotals[e.category]||0)+Number(e.amount);});
  const allCat=[...new Set([...Object.keys(catTotals),...Object.keys(prevCatTotals)])].sort((a,b)=>(catTotals[b]||0)-(catTotals[a]||0));
  const catRows=allCat.map(code=>{
    const cur=catTotals[code]||0, prev=prevCatTotals[code]||0, d=cur-prev;
    const cls=d>50?"up":d<-50?"dn":"eq";
    const ds=d===0?"—":((d>=0?"+":"")+"$"+Math.abs(d).toLocaleString());
    return `<div class="yoy-row">
      <span class="yoy-lbl">${catLabel(code)}</span>
      <div class="yoy-vals">
        <span class="yoy-cur">$${cur.toLocaleString()}</span>
        <span class="yoy-diff ${cls}">${ds}</span>
      </div></div>`;
  }).join("");

  document.getElementById("analysis-content").innerHTML=`
    <div class="m3">
      <div class="mc"><div class="ml">${selYear} 支出</div><div class="mn pui">$${curTotal.toLocaleString()}</div>${prevTotal?`<div class="mn-sub ${diffCls}">${diffSign}$${Math.abs(diff).toLocaleString()}</div>`:''}</div>
      <div class="mc"><div class="ml">${prevYear} 支出</div><div class="mn" style="color:var(--t2)">${prevTotal?'$'+prevTotal.toLocaleString():'—'}</div></div>
      <div class="mc"><div class="ml">月均（${selYear}）</div><div class="mn">$${Math.round(curTotal/monthsWithData).toLocaleString()}</div></div>
    </div>

    <div style="margin:4px 0 18px">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2)"><div style="width:10px;height:10px;border-radius:2px;background:var(--pu)"></div>${selYear}</div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t3)"><div style="width:10px;height:10px;border-radius:2px;background:var(--t3);opacity:.5"></div>${prevYear}</div>
      </div>
      <svg width="100%" height="${svgH}" style="display:block;overflow:visible">${bars}</svg>
    </div>

    <div class="section-lbl">逐月比較</div>
    <div class="cat-list" style="margin-bottom:18px">${monRows||'<div style="color:var(--t3);font-size:13px;padding:8px 0">無資料</div>'}</div>

    <div class="section-lbl">各類別　${selYear} vs ${prevYear}</div>
    <div class="cat-list">${catRows||'<div style="color:var(--t3);font-size:13px;padding:8px 0">無資料</div>'}</div>`;
}

let toastTimer;
function showToast(msg,type="ok",big=false){
  const el=document.getElementById("toast");
  el.textContent=msg;el.style.background=type==="err"?"var(--r)":"var(--zo)";
  el.classList.toggle("big",!!big);
  el.classList.add("show");clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"), big?2800:4000);
}

// ★ start：不再自動抓資料，等你切到「本月」或「分析」才載入
updateDashTab();
</script>
